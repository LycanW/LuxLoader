plugins {
    id 'java-library'
}

description = 'Shader compiler discovery, compilation, disk caching and background work.'

dependencies {
    api project(':luxloader-api')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Optional bundled compiler: run :luxloader-shader:fetchSlangc for a self-contained release. Ordinary builds use an installed compiler from PATH. Cache official releases in .tools/slang-cache and package only SPIR-V dependencies: driver, runtime, compiler and slang-glslang (needed for spirv-opt even for Slang input). CPU-only slang-llvm is unnecessary. slang_platforms selects target platforms.
ext {
    slangVersion = providers.gradleProperty('slang_version').getOrElse('2026.18')
    slangPlatforms = providers.gradleProperty('slang_platforms')
            .getOrElse('windows-x86_64').split(',')*.trim()
}

// Required files under each official release bin/ directory: compiler executable followed by runtime libraries.
def slangPlatformFiles = [
        'windows-x86_64' : ['slangc.exe', 'slang.dll', 'slang-compiler.dll', 'slang-glslang.dll'],
        'windows-aarch64': ['slangc.exe', 'slang.dll', 'slang-compiler.dll', 'slang-glslang.dll'],
        'linux-x86_64'   : ['slangc', 'libslang.so', 'libslang-compiler.so', 'libslang-glslang.so'],
        'linux-aarch64'  : ['slangc', 'libslang.so', 'libslang-compiler.so', 'libslang-glslang.so'],
        'macos-x86_64'   : ['slangc', 'libslang.dylib', 'libslang-compiler.dylib', 'libslang-glslang.dylib'],
        'macos-aarch64'  : ['slangc', 'libslang.dylib', 'libslang-compiler.dylib', 'libslang-glslang.dylib'],
]

tasks.register('fetchSlangc') {
    group = 'luxloader'
    description = 'Fetch the official Slang distribution and package SPIR-V compiler dependencies.'

    def version = project.ext.slangVersion
    def platforms = project.ext.slangPlatforms
    def resRoot = layout.projectDirectory.dir('src/main/resources/native')
    def toolsDir = rootProject.layout.projectDirectory.dir('.tools/slang-cache')

    // Binary outputs are not tracked reliably by Gradle, but download and extraction caches make repeated runs inexpensive.
    outputs.upToDateWhen { false }

    doLast {
        platforms.each { platform ->
            def wanted = slangPlatformFiles[platform]
            if (wanted == null) {
                throw new GradleException(
                        "Unsupported platform: ${platform} (allowed: ${slangPlatformFiles.keySet().join(', ')})")
            }
            def asset = "slang-${version}-${platform}.zip"
            def url = "https://github.com/shader-slang/slang/releases/download/v${version}/${asset}"
            def zipFile = new File(toolsDir.asFile, asset)
            zipFile.parentFile.mkdirs()

            if (!zipFile.exists()) {
                logger.lifecycle("Downloading ${url}")
                new URL(url).withInputStream { input ->
                    zipFile.withOutputStream { output -> output << input }
                }
            }

            def unpackDir = new File(toolsDir.asFile, "unpacked-${version}-${platform}")
            if (!new File(unpackDir, 'bin').isDirectory()) {
                copy {
                    from zipTree(zipFile)
                    into unpackDir
                }
            }

            def binDir = new File(unpackDir, 'bin')
            if (!binDir.isDirectory()) {
                throw new GradleException("Unexpected release layout; bin/ not found: ${unpackDir}")
            }

            def targetDir = new File(resRoot.asFile, platform)
            targetDir.mkdirs()
            long total = 0
            def placed = []
            wanted.each { name ->
                def src = new File(binDir, name)
                if (!src.isFile()) {
                    logger.warn("Release missing ${name}; skipping (${platform})")
                    return
                }
                copy {
                    from src
                    into targetDir
                }
                placed << name
                total += src.length()
            }
            if (placed.isEmpty()) {
                throw new GradleException("No files extracted; check release layout and version: ${unpackDir}")
            }

            // The small manifest records extraction and version, avoiding a full compiler-binary read on each startup.
            new File(targetDir, 'manifest.properties').text = """\
                    # LuxLoader bundled Slang compiler. Generated by :luxloader-shader:fetchSlangc; do not edit.
                    slang.version=${version}
                    files=${placed.join(',')}
                    """.stripIndent()

            logger.lifecycle("${platform}: Installed in ${targetDir}"
                    + " (${String.format('%.1f', total / 1024.0 / 1024.0)} MB, ${placed.size()} files)")
        }
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'LuxLoader Shader',
                'Implementation-Version': project.version
        )
    }
}
