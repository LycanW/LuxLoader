# NeoForge mod metadata must be TOML; JSON content with a .toml extension is rejected by FML.

modLoader = "javafml"
# NeoForge 26.3 uses javafml 3.x.
loaderVersion = "[3,)"
license = "MIT"

[[mods]]
modId = "luxloader"
version = "0.1.0"
displayName = "LuxLoader"
description = '''
Rendering pipeline loader for Minecraft Vulkan: registration, runtime switching, capability negotiation and diagnostics.
'''
authors = "LuxLoader"

# Shared mixins intercept presentation and release Vulkan objects before host device destruction. RenderFrameEvent alone cannot replace the blit source or enforce device teardown ordering.
[[mixins]]
config = "luxloader.hooks.mixins.json"

# Client-side dependencies use side = "CLIENT".
[[dependencies.luxloader]]
modId = "neoforge"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.luxloader]]
modId = "minecraft"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "CLIENT"
